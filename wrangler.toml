name = "msp-portfolio"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Browser origins allowed to call /mcp: the GitHub Pages site + local dev.
# MCP clients (Claude Code, Cursor, ...) send no Origin header and always pass.
[vars]
ALLOWED_ORIGINS = "https://mansio.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Respective Cloudflare account/zone info goes here for production routes.
# With `workers_dev = true` (default) the worker gets a public URL like
# https://msp-portfolio.<subdomain>.workers.dev automatically.

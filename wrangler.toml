name = "msp-portfolio"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

# Browser origins allowed to call /mcp: the GitHub Pages site + local dev.
# MCP clients (Claude Code, Cursor, ...) send no Origin header and always pass.
[vars]
ALLOWED_ORIGINS = "https://mansio.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Abuse protection: CF Rate Limiting API (wrangler >= 4.36, no added latency,
# per-location eventually-consistent counters). The worker fail-opens if a
# binding is missing, but these are required for production protection.
# Note: namespace_id must be a positive integer, unique per CF account —
# change it if it collides with an existing namespace.
[[ratelimits]]
name = "MCP_RATE_LIMITER"
namespace_id = "3001"

  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "3002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Telemetry: one event per /mcp request (RPC method + tool name). Enabled in
# the dashboard 2026-08-14; the dataset auto-creates on the first write.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "msprof"

# Agent counter (see worker /mcp/stats): daily + total tool invocations.
# Created 2026-08-14 via `wrangler kv namespace create MCP_STATS`.
[[kv_namespaces]]
binding = "MCP_STATS"
id = "4a57c087950841e88c27239d2c7d8c21"

# Respective Cloudflare account/zone info goes here for production routes.
# With `workers_dev = true` (default) the worker gets a public URL like
# https://msp-portfolio.<subdomain>.workers.dev automatically.

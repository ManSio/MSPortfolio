# Publishes server.json to the official MCP Registry on version tags.
# Based on the official guide: docs/modelcontextprotocol-io/github-actions.mdx
# (OIDC variant). Remote-only server — no package registry step needed.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"] # Triggers on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Set version in server.json
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry (raw HTTP)
        run: |
          token=$(jq -r .token ~/.config/mcp-publisher/token.json)
          out=$(curl -sS -w '\nHTTP:%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data-binary @server.json \
            https://registry.modelcontextprotocol.io/v0/publish 2>&1)
          http_code=$(printf '%s' "$out" | grep -o 'HTTP:[0-9]*' | tail -1)
          echo "::error::publish http=$http_code body=$(printf '%s' "$out" | sed 's/HTTP:[0-9]*$//' | tail -c 2500)"
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then exit 1; fi

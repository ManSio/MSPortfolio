name: Deploy Portfolio

on:
  push:
    branches: [main]
  schedule:
    # refresh the metrics snapshot hourly
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      # Timestamp of the snapshot this run built. The smoke job asserts the
      # DEPLOYED metrics.json matches it by equality — a wall-clock age check
      # is both racy and unsatisfiable (see "Check deployed metrics snapshot").
      metrics_fetched_at: ${{ steps.refresh_metrics.outputs.fetched_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: npx tsc -p server/tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Refresh metrics snapshot
        # Runs BEFORE build so the deployed dist/ ships the fresh snapshot
        # (commits, dev.to, GitHub metrics) instead of the previous one.
        # Also exports fetchedAt so the smoke job can assert the deployed
        # snapshot by equality instead of by wall-clock age.
        id: refresh_metrics
        run: |
          node scripts/update-metrics.ts
          echo "fetched_at=$(jq -r .fetchedAt public/metrics.json)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  smoke:
    runs-on: ubuntu-latest
    # Runs after deploy-worker so the freshness check below compares the live
    # Worker against the same commit that was just deployed. Fails loudly when
    # the endpoint is down or serves stale data.
    needs: [deploy, deploy-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Check MCP data freshness
        # Regression guard: a healthy endpoint can still serve stale lab data —
        # the Worker lags origin/main until a push deploys it. Compare the live
        # MCP payload against the repo JSON this commit ships (equality, not a
        # hardcoded floor, so it never needs manual bumping).
        run: |
          MCP=https://msp-portfolio.mansio-dev.workers.dev/mcp
          sse_text() { sed -n 's/^data: //p' | jq -r '.result.content[0].text'; }
          call() {
            curl -fsS -X POST "$MCP" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":$1,\"method\":\"tools/call\",\"params\":{\"name\":\"$2\",\"arguments\":{}}}"
          }
          repo_exp=$(jq '.experiments | length' src/data/lab/experiments.json)
          repo_ki=$(jq '.issues | length' src/data/lab/known-issues.json)
          live_exp=$(call 3 get_experiments | sse_text | jq '.experiments | length')
          live_ki=$(call 4 get_known_issues | sse_text | jq '.count')
          echo "experiments: repo=$repo_exp live=$live_exp"
          echo "known-issues: repo=$repo_ki live=$live_ki"
          if [ "$live_exp" != "$repo_exp" ]; then
            echo "::error::MCP serves stale experiments ($live_exp != $repo_exp) — the Worker is behind origin/main"
            exit 1
          fi
          if [ "$live_ki" != "$repo_ki" ]; then
            echo "::error::MCP serves stale known-issues ($live_ki != $repo_ki) — the Worker is behind origin/main"
            exit 1
          fi
          echo 'MCP data is fresh ✔'

      - name: Check MCP endpoint health
        run: |
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"ok":true'
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"chatConfigured"'
          echo 'MCP endpoint is healthy ✔'
      - name: Check MCP tools/list
        run: |
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'simulate_architecture'
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_commit_history'
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_antipatterns'
          echo 'tools/list works ✔'
      - name: Check MCP tools/call (get_articles)
        # Regression guard for KI-006: get_articles returned 403 from dev.to.
        # Note: the tool payload nests JSON inside the SSE `text` field, so the
        # field name is escaped (\"count\") — match the bare token instead.
        run: |
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_articles","arguments":{}}}' | grep -q count
          echo 'get_articles works ✔'
      - name: Check MCP articles freshness
        # Regression guard: get_articles silently falls back to a stale snapshot
        # (or an empty payload) without failing the count check above. Assert it
        # serves live-or-fresh data.
        run: |
          set -euo pipefail
          MCP=https://msp-portfolio.mansio-dev.workers.dev/mcp
          sse_text() { sed -n 's/^data: //p' | jq -r '.result.content[0].text'; }
          art=$(curl -fsS -X POST "$MCP" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get_articles","arguments":{}}}' \
            | sse_text)
          echo "get_articles: source=$(echo "$art" | jq -r '.source') count=$(echo "$art" | jq -r '.count')"
          echo "$art" | jq -e '.source != "unavailable" and (.count >= 1)' >/dev/null \
            || { echo "::error::get_articles is empty or unavailable"; exit 1; }
          echo 'MCP articles are fresh ✔'

      - name: Check deployed metrics snapshot
        # Regression guard for the metrics snapshot reaching the live site.
        #
        # This used to assert `server Date - fetchedAt <= 120 min`. Both halves
        # of that were wrong, and run 36443556281 failed because of it:
        #   1. RACY — the check read mansio.github.io immediately after the
        #      `deploy` job, but Pages publishes on its own schedule (observed
        #      24-65 s later). It read the PREVIOUS run's snapshot and computed
        #      514 min of "staleness" for a snapshot that was about to be
        #      replaced 20 s later. A guard that fails on a healthy deploy is
        #      worse than no guard.
        #   2. UNSATISFIABLE — `17 * * * *` is not delivered hourly: 46 of the
        #      last 46 inter-run gaps on this repo exceeded 120 min (max 514).
        #      GitHub queues schedule events, so any age bound below the real
        #      cadence fails by construction.
        #
        # The deploy job already refreshes the snapshot on EVERY run and exports
        # the exact fetchedAt it built. So assert EQUALITY against that value:
        # it is independent of cron cadence, needs no magic threshold, and
        # cannot false-positive on scheduling jitter.
        #
        # The poll window must exceed the CDN TTL, not just the Pages build
        # time: GH Pages serves with `Cache-Control: max-age=600`, and a
        # `?cb=` query param does NOT bypass it (measured: `Age` kept growing
        # across distinct query strings — same cached object). So the freshly
        # published snapshot can stay invisible for up to 10 min. 30 x 30s =
        # 15 min covers Pages build (measured 24-65 s) plus a full TTL cycle.
        # Normal case matches on attempt 1-2; the loop is a bounded wait, not
        # the common path.
        env:
          EXPECTED_FETCHED_AT: ${{ needs.deploy.outputs.metrics_fetched_at }}
        run: |
          set -euo pipefail
          METRICS=https://mansio.github.io/MSPortfolio/metrics.json
          if [ -z "$EXPECTED_FETCHED_AT" ]; then
            echo "::error::deploy did not export metrics_fetched_at — snapshot freshness is unverifiable"
            exit 1
          fi
          for i in $(seq 1 30); do
            live=$(curl -fsS "$METRICS" | jq -r '.fetchedAt')
            if [ "$live" = "$EXPECTED_FETCHED_AT" ]; then
              echo "deployed metrics.json matches this run's snapshot ✔ (attempt $i)"
              echo 'MCP articles are fresh ✔'
              exit 0
            fi
            echo "attempt $i/30: deployed fetchedAt=$live, expected $EXPECTED_FETCHED_AT — waiting for Pages (TTL 600s)"
            sleep 30
          done
          echo "::error::deployed metrics.json never matched this run's snapshot (live=$live, expected=$EXPECTED_FETCHED_AT) after 15 min"
          exit 1

  deploy-worker:
    # Auto-deploys the MCP worker on every push once the Cloudflare API token
    # secret is added (gh secret set CLOUDFLARE_API_TOKEN). Skipped otherwise.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy MCP worker
        # secrets context is not allowed in `if` — proxy through env instead
        if: ${{ env.CF_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

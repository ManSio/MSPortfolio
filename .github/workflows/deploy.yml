name: Deploy Portfolio

on:
  push:
    branches: [main]
  schedule:
    # refresh the metrics snapshot hourly
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: npx tsc -p server/tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Refresh metrics snapshot
        run: node scripts/update-metrics.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  smoke:
    runs-on: ubuntu-latest
    # The MCP Worker is deployed manually (needs a Cloudflare account); this
    # job verifies the public endpoint answers. Fails loudly when it doesn't.
    needs: deploy
    steps:
      - name: Check MCP endpoint health
        run: |
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"ok":true'
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"chatConfigured"'
          echo 'MCP endpoint is healthy ✔'
      - name: Check MCP tools/list
        run: |
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'simulate_architecture'
          echo 'tools/list works ✔'

  deploy-worker:
    # Auto-deploys the MCP worker on every push once the Cloudflare API token
    # secret is added (gh secret set CLOUDFLARE_API_TOKEN). Skipped otherwise.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy MCP worker
        # secrets context is not allowed in `if` — proxy through env instead
        if: ${{ env.CF_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

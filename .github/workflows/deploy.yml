name: Deploy Portfolio

on:
  push:
    branches: [main]
  schedule:
    # refresh the metrics snapshot hourly
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check server
        run: npx tsc -p server/tsconfig.json

      - name: Unit tests
        run: pnpm test

      - name: Refresh metrics snapshot
        # Runs BEFORE build so the deployed dist/ ships the fresh snapshot
        # (commits, dev.to, GitHub metrics) instead of the previous one.
        run: node scripts/update-metrics.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  smoke:
    runs-on: ubuntu-latest
    # Runs after deploy-worker so the freshness check below compares the live
    # Worker against the same commit that was just deployed. Fails loudly when
    # the endpoint is down or serves stale data.
    needs: [deploy, deploy-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Check MCP data freshness
        # Regression guard: a healthy endpoint can still serve stale lab data —
        # the Worker lags origin/main until a push deploys it. Compare the live
        # MCP payload against the repo JSON this commit ships (equality, not a
        # hardcoded floor, so it never needs manual bumping).
        run: |
          MCP=https://msp-portfolio.mansio-dev.workers.dev/mcp
          sse_text() { sed -n 's/^data: //p' | jq -r '.result.content[0].text'; }
          call() {
            curl -fsS -X POST "$MCP" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":$1,\"method\":\"tools/call\",\"params\":{\"name\":\"$2\",\"arguments\":{}}}"
          }
          repo_exp=$(jq '.experiments | length' src/data/lab/experiments.json)
          repo_ki=$(jq '.issues | length' src/data/lab/known-issues.json)
          live_exp=$(call 3 get_experiments | sse_text | jq '.experiments | length')
          live_ki=$(call 4 get_known_issues | sse_text | jq '.count')
          echo "experiments: repo=$repo_exp live=$live_exp"
          echo "known-issues: repo=$repo_ki live=$live_ki"
          if [ "$live_exp" != "$repo_exp" ]; then
            echo "::error::MCP serves stale experiments ($live_exp != $repo_exp) — the Worker is behind origin/main"
            exit 1
          fi
          if [ "$live_ki" != "$repo_ki" ]; then
            echo "::error::MCP serves stale known-issues ($live_ki != $repo_ki) — the Worker is behind origin/main"
            exit 1
          fi
          echo 'MCP data is fresh ✔'

      - name: Check MCP endpoint health
        run: |
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"ok":true'
          curl -fsS https://msp-portfolio.mansio-dev.workers.dev/mcp/health | grep -q '"chatConfigured"'
          echo 'MCP endpoint is healthy ✔'
      - name: Check MCP tools/list
        run: |
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'simulate_architecture'
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_commit_history'
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q 'get_antipatterns'
          echo 'tools/list works ✔'
      - name: Check MCP tools/call (get_articles)
        # Regression guard for KI-006: get_articles returned 403 from dev.to.
        # Note: the tool payload nests JSON inside the SSE `text` field, so the
        # field name is escaped (\"count\") — match the bare token instead.
        run: |
          curl -fsS -X POST https://msp-portfolio.mansio-dev.workers.dev/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_articles","arguments":{}}}' | grep -q count
          echo 'get_articles works ✔'

  deploy-worker:
    # Auto-deploys the MCP worker on every push once the Cloudflare API token
    # secret is added (gh secret set CLOUDFLARE_API_TOKEN). Skipped otherwise.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy MCP worker
        # secrets context is not allowed in `if` — proxy through env instead
        if: ${{ env.CF_TOKEN != '' }}
        run: npx --yes wrangler@4 deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

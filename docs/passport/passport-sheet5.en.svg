<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Quality passport of mscodebase-intelligence, sheet 5">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9d4c3" stroke-width="0.6"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,Helvetica,sans-serif}
    .mono{font-family:"Liberation Mono","DejaVu Sans Mono","Courier New",monospace}
    .ink{fill:#1b2a3a}
    .line{stroke:#1b2a3a;fill:none}
    .h{font-size:10px;letter-spacing:1px;fill:#5a6a7a}
    .t{font-size:10.5px;fill:#5a6a7a}
    .ok{stroke:#1f6f4a;fill:none;stroke-width:2.5}
    .okt{fill:#1f6f4a;font-weight:700}
    .snap{stroke:#2b5b84;fill:none;stroke-width:2.5}
    .snapt{fill:#2b5b84;font-weight:700}
    .rej{stroke:#4a5568;fill:none;stroke-width:2.5}
    .rejt{fill:#4a5568;font-weight:700}
    .bad{stroke:#b3261e;fill:none;stroke-width:2.5}
    .badt{fill:#b3261e;font-weight:700}
  </style>

  <rect width="900" height="640" fill="#f6f3ea"/>
  <rect width="900" height="640" fill="url(#grid)"/>
  <rect x="10" y="10" width="880" height="620" class="line" stroke-width="2.5"/>
  <rect x="18" y="18" width="864" height="604" class="line" stroke-width="0.8"/>
  <text x="36" y="50" class="ink sans" font-size="20" font-weight="700">OBJECT QUALITY PASSPORT</text>
  <text x="36" y="68" class="h sans">QUALITY PASSPORT · mscodebase-intelligence · ManSio · EN</text>
  <text x="864" y="50" class="ink mono" font-size="12" text-anchor="end">SHEET 5 / 7</text>
  <text x="864" y="68" class="h sans" font-size="10" text-anchor="end">OPERATING LIMITS</text>
  <line x1="18" y1="82" x2="882" y2="82" class="line" stroke-width="1.5"/>
  <text x="30" y="102" class="h sans" font-size="10">#</text>
  <text x="78" y="102" class="h sans" font-size="10">LIMIT</text>
  <text x="292" y="102" class="h sans" font-size="10">HOW IT SHOWS</text>
  <text x="584" y="102" class="h sans" font-size="10">WHAT TO DO</text>
  <line x1="18" y1="110" x2="882" y2="110" class="line" stroke-width="1"/>
  <text x="30" y="138" class="ink mono" font-size="10">L-01</text>
  <text x="78" y="138" class="ink sans" font-size="11" font-weight="600">Docs gold vs document language</text>
  <text x="292" y="138" class="sans" font-size="9" fill="#1b2a3a">the channel may return docs/ru/X.md when gold is</text>
  <text x="292" y="149" class="sans" font-size="9" fill="#1b2a3a">docs/en/X.md</text>
  <text x="584" y="138" class="sans" font-size="9" fill="#5a6a7a">normalise by basename when evaluating</text>
  <line x1="18" y1="164" x2="882" y2="164" class="line" stroke-width="0.6"/>
  <text x="30" y="178" class="ink mono" font-size="10">L-02</text>
  <text x="78" y="178" class="ink sans" font-size="11" font-weight="600">Auto docs routing is a heuristic</text>
  <text x="292" y="178" class="sans" font-size="9" fill="#1b2a3a">a code query with strong docs words is routed to</text>
  <text x="292" y="189" class="sans" font-size="9" fill="#1b2a3a">documentation</text>
  <text x="584" y="178" class="sans" font-size="9" fill="#5a6a7a">intent="code" is the escape hatch</text>
  <line x1="18" y1="204" x2="882" y2="204" class="line" stroke-width="0.6"/>
  <text x="30" y="218" class="ink mono" font-size="10">L-03</text>
  <text x="78" y="218" class="ink sans" font-size="11" font-weight="600">Full vector reindex is blocked</text>
  <text x="292" y="218" class="sans" font-size="9" fill="#1b2a3a">while MSCODEBASE_DENSE_OFF=true (the project default)</text>
  <text x="584" y="218" class="sans" font-size="9" fill="#5a6a7a">rebuild_graph.py / reindex_text_only.py</text>
  <line x1="18" y1="244" x2="882" y2="244" class="line" stroke-width="0.6"/>
  <text x="30" y="258" class="ink mono" font-size="10">L-04</text>
  <text x="78" y="258" class="ink sans" font-size="11" font-weight="600">No 95% claim</text>
  <text x="292" y="258" class="sans" font-size="9" fill="#1b2a3a">static retrieval and the local rerankers did not</text>
  <text x="292" y="269" class="sans" font-size="9" fill="#1b2a3a">reach it</text>
  <text x="584" y="258" class="sans" font-size="9" fill="#5a6a7a">an LLM planner is a separate experiment</text>
  <line x1="18" y1="284" x2="882" y2="284" class="line" stroke-width="0.6"/>
  <text x="30" y="298" class="ink mono" font-size="10">L-05</text>
  <text x="78" y="298" class="ink sans" font-size="11" font-weight="600">Fast mode is not quality mode</text>
  <text x="292" y="298" class="sans" font-size="9" fill="#1b2a3a">materially less accurate on mixed natural-language</text>
  <text x="292" y="309" class="sans" font-size="9" fill="#1b2a3a">questions</text>
  <text x="584" y="298" class="sans" font-size="9" fill="#5a6a7a">quality mode when accuracy matters</text>
  <line x1="18" y1="324" x2="882" y2="324" class="line" stroke-width="0.6"/>
  <text x="30" y="338" class="ink mono" font-size="10">L-06</text>
  <text x="78" y="338" class="ink sans" font-size="11" font-weight="600">Tool visibility is a profile</text>
  <text x="292" y="338" class="sans" font-size="9" fill="#1b2a3a">69 registered, 17 visible by default</text>
  <text x="584" y="338" class="sans" font-size="9" fill="#5a6a7a">tool_help(); switch the profile</text>
  <line x1="18" y1="364" x2="882" y2="364" class="line" stroke-width="0.6"/>
  <text x="30" y="378" class="ink mono" font-size="10">L-07</text>
  <text x="78" y="378" class="ink sans" font-size="11" font-weight="600">LSP tools need a working</text>
  <text x="78" y="390" class="ink sans" font-size="11" font-weight="600">basedpyright</text>
  <text x="292" y="378" class="sans" font-size="9" fill="#1b2a3a">without it they fail fast, the result is cached for</text>
  <text x="292" y="389" class="sans" font-size="9" fill="#1b2a3a">30 s</text>
  <text x="584" y="378" class="sans" font-size="9" fill="#5a6a7a">install basedpyright</text>
  <line x1="18" y1="404" x2="882" y2="404" class="line" stroke-width="0.6"/>
  <text x="36" y="456" class="ink sans" font-size="12" font-weight="600">How to read</text>
  <text x="36" y="472" class="t sans" font-size="10">A limit is not an excuse but an operating condition:</text>
  <text x="36" y="486" class="t sans" font-size="10">it says on which input the result must not be trusted.</text>
  <text x="36" y="508" class="ink sans" font-size="12" font-weight="600">Where it comes from</text>
  <text x="36" y="524" class="t sans" font-size="10">The 7 items of README §Limitations, neither paraphrased nor softened.</text>
  <text x="36" y="538" class="t sans" font-size="10">The docs-gold item is a labelling property, not a retrieval defect.</text>
  <text x="36" y="566" class="ink mono" font-size="9.5">Source: README.md §Limitations, docs/FACTS.md §8.</text>
  <rect x="540" y="442" width="330" height="154" class="line" stroke-width="1.5"/>
  <line x1="540" y1="464" x2="870" y2="464" class="line" stroke-width="0.8"/>
  <line x1="540" y1="486" x2="870" y2="486" class="line" stroke-width="0.8"/>
  <line x1="540" y1="508" x2="870" y2="508" class="line" stroke-width="0.8"/>
  <line x1="540" y1="530" x2="870" y2="530" class="line" stroke-width="0.8"/>
  <line x1="540" y1="552" x2="870" y2="552" class="line" stroke-width="0.8"/>
  <line x1="540" y1="574" x2="870" y2="574" class="line" stroke-width="0.8"/>
  <line x1="632" y1="442" x2="632" y2="596" class="line" stroke-width="0.8"/>
  <text x="548" y="457" class="h sans" font-size="10">OBJECT</text>
  <text x="640" y="457" class="ink mono" font-size="10">mscodebase-intelligence</text>
  <text x="548" y="479" class="h sans" font-size="10">VERSION</text>
  <text x="640" y="479" class="ink mono" font-size="10">v3.5.0 / Python 3.14</text>
  <text x="548" y="501" class="h sans" font-size="10">REVISION</text>
  <text x="640" y="501" class="ink mono" font-size="10">main @ 1c4062d · 13.11.2026</text>
  <text x="548" y="523" class="h sans" font-size="10">FILE</text>
  <text x="640" y="523" class="ink mono" font-size="10">docs/FACTS.md · 5,222 B</text>
  <text x="548" y="545" class="h sans" font-size="10">SHA-256</text>
  <text x="640" y="545" class="ink mono" font-size="10">a93abe59…05794985</text>
  <text x="548" y="567" class="h sans" font-size="10">BUILD</text>
  <text x="640" y="567" class="ink mono" font-size="10">unsigned · before release</text>
  <text x="548" y="589" class="h sans" font-size="10">CHECKED BY</text>
  <text x="640" y="589" class="ink mono" font-size="9.5">________  M. ManSio  __.__.____</text>
</svg>

  <rect x="10" y="10" width="880" height="620" class="line" stroke-width="2.5"/>
  <rect x="18" y="18" width="864" height="604" class="line" stroke-width="0.8"/>
  <text x="36" y="50" class="ink sans" font-size="20" font-weight="700">ПАСПОРТ КАЧЕСТВА ОБЪЕКТА</text>
  <text x="36" y="68" class="h sans">QUALITY PASSPORT · mscodebase-intelligence · ManSio</text>
  <text x="864" y="50" class="ink mono" font-size="12" text-anchor="end">ЛИСТ 4 / 7</text>
  <text x="864" y="68" class="h sans" font-size="10" text-anchor="end">АКТЫ СКРЫТЫХ РАБОТ</text>
  <line x1="18" y1="82" x2="882" y2="82" class="line" stroke-width="1.5"/>
  <text x="30" y="102" class="h sans" font-size="10">№</text>
  <text x="78" y="102" class="h sans" font-size="10">АКТ</text>
  <text x="172" y="102" class="h sans" font-size="10">РЕШЕНИЕ (ADR)</text>
  <text x="470" y="102" class="h sans" font-size="10">СТАТУС</text>
  <text x="570" y="102" class="h sans" font-size="10">ЧТО ДЕРЖИТ</text>
  <text x="866" y="102" class="h sans" font-size="10" text-anchor="end">ДАТА</text>
  <line x1="18" y1="110" x2="882" y2="110" class="line" stroke-width="1"/>
  <text x="30" y="138" class="ink mono" font-size="10">ADR-0001</text>
  <text x="172" y="138" class="ink sans" font-size="11.5" font-weight="600">Модель угроз для песочницы execute_script</text>
  <text x="470" y="138" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ПРИНЯТ</text>
  <text x="570" y="138.0" class="sans" font-size="9.5" fill="#3d4b5a">что именно разрешено исполнять; границы A1–A5</text>
  <text x="866" y="138" class="ink mono" font-size="10" text-anchor="end">05.08</text>
  <line x1="18" y1="166" x2="882" y2="166" class="line" stroke-width="0.6"/>
  <text x="30" y="180" class="ink mono" font-size="10">ADR-0002</text>
  <text x="172" y="180" class="ink sans" font-size="11.5" font-weight="600">RetractionReceipt: отзыв SILENT-фактов</text>
  <text x="172" y="193" class="ink sans" font-size="11.5" font-weight="600">памяти</text>
  <text x="470" y="180" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ПРИНЯТ</text>
  <text x="570" y="180.0" class="sans" font-size="9.5" fill="#3d4b5a">память не остаётся «навсегда верной»</text>
  <text x="866" y="180" class="ink mono" font-size="10" text-anchor="end">11.08</text>
  <line x1="18" y1="208" x2="882" y2="208" class="line" stroke-width="0.6"/>
  <text x="30" y="222" class="ink mono" font-size="10">ADR-0003</text>
  <text x="172" y="222" class="ink sans" font-size="11.5" font-weight="600">Verify-On-Read: проверка ACTIVE при чтении</text>
  <text x="470" y="222" class="sans" font-size="9" font-weight="700" fill="#b26a00">ПРЕДЛОЖЕН</text>
  <text x="570" y="222.0" class="sans" font-size="9.5" fill="#3d4b5a">4 условия; не реализовано — ждёт замера</text>
  <text x="866" y="222" class="ink mono" font-size="10" text-anchor="end">11.08</text>
  <line x1="18" y1="250" x2="882" y2="250" class="line" stroke-width="0.6"/>
  <text x="30" y="264" class="ink mono" font-size="10">ADR-0004</text>
  <text x="172" y="264" class="ink sans" font-size="11.5" font-weight="600">Типизированные рёбра зависимостей +</text>
  <text x="172" y="277" class="ink sans" font-size="11.5" font-weight="600">распространение</text>
  <text x="470" y="264" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ПРИНЯТ</text>
  <text x="570" y="264.0" class="sans" font-size="9.5" fill="#3d4b5a">отзыв факта доходит до зависимых узлов</text>
  <text x="866" y="264" class="ink mono" font-size="10" text-anchor="end">12.08</text>
  <line x1="18" y1="292" x2="882" y2="292" class="line" stroke-width="0.6"/>
  <text x="30" y="306" class="ink mono" font-size="10">ADR-0005</text>
  <text x="172" y="306" class="ink sans" font-size="11.5" font-weight="600">pkg:-анкеры: closed-world проверка пакетов</text>
  <text x="470" y="306" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ПРИНЯТ</text>
  <text x="570" y="306.0" class="sans" font-size="9.5" fill="#3d4b5a">проверка версии без доверия к сети</text>
  <text x="866" y="306" class="ink mono" font-size="10" text-anchor="end">14.08</text>
  <line x1="18" y1="334" x2="882" y2="334" class="line" stroke-width="0.6"/>
  <text x="30" y="348" class="ink mono" font-size="10">ADR-0006</text>
  <text x="172" y="348" class="ink sans" font-size="11.5" font-weight="600">LSP-обогащение графа: CALLS + semantic</text>
  <text x="172" y="361" class="ink sans" font-size="11.5" font-weight="600">tokens</text>
  <text x="470" y="348" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ПРИНЯТ</text>
  <text x="570" y="348.0" class="sans" font-size="9.5" fill="#3d4b5a">точные call-sites; ! 0 потребителей у двух</text>
  <text x="570" y="359.5" class="sans" font-size="9.5" fill="#3d4b5a">выходов</text>
  <text x="866" y="348" class="ink mono" font-size="10" text-anchor="end">19.08</text>
  <line x1="18" y1="376" x2="882" y2="376" class="line" stroke-width="0.6"/>
  <text x="30" y="390" class="ink mono" font-size="10">ADR-0007</text>
  <text x="172" y="390" class="ink sans" font-size="11.5" font-weight="600">Git-локи: один писатель на ресурс между</text>
  <text x="172" y="403" class="ink sans" font-size="11.5" font-weight="600">агентами</text>
  <text x="470" y="390" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ДЕЙСТВУЕТ</text>
  <text x="570" y="390.0" class="sans" font-size="9.5" fill="#3d4b5a">параллельные сессии не топчут дерево</text>
  <text x="866" y="390" class="ink mono" font-size="10" text-anchor="end">24.08</text>
  <line x1="18" y1="418" x2="882" y2="418" class="line" stroke-width="0.6"/>
  <text x="36" y="456" class="ink sans" font-size="12" font-weight="600">Как читать</text>
  <text x="36" y="472" class="t sans" font-size="10">Скрытые работы — решения, которых не видно в выдаче, но без них</text>
  <text x="36" y="486" class="t sans" font-size="10">конструкция не держит: границы доверия, отзыв фактов, локи.</text>
  <text x="36" y="508" class="ink sans" font-size="12" font-weight="600">Статусы акта</text>
  <text x="36" y="524" class="t sans" font-size="10">ПРИНЯТ — решение действует. ПРЕДЛОЖЕН — не реализовано.</text>
  <text x="36" y="538" class="t sans" font-size="10">Пометка «! 0 потребителей» — акт есть, нагрузки нет.</text>
  <text x="36" y="566" class="ink mono" font-size="9.5">Источник: docs/adr/ (7 актов), KNOWN_ISSUES.md (дебит ADR-0006).</text>

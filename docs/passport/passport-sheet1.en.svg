  <text x="36" y="128" class="h sans" font-size="10">VERSION</text>
  <text x="140" y="128" class="ink mono" font-size="9.5">v3.5.0 · Python 3.14</text>
  <text x="36" y="148" class="h sans" font-size="10">REVISION</text>
  <text x="140" y="148" class="ink mono" font-size="9.5">main @ 1c4062d · 13.11.2026</text>
  <text x="470" y="108" class="h sans" font-size="10">OWNER</text>
  <text x="574" y="108" class="ink mono" font-size="9.5">M. ManSio / ManSio</text>
  <text x="470" y="128" class="h sans" font-size="10">LICENSE</text>
  <text x="574" y="128" class="ink mono" font-size="9.5">MIT</text>
  <text x="470" y="148" class="h sans" font-size="10">PLATFORM</text>
  <text x="574" y="148" class="ink mono" font-size="9.5">Windows validated · Linux CI</text>
  <line x1="18" y1="168" x2="882" y2="168" class="line" stroke-width="1"/>
  <text x="36" y="192" class="ink sans" font-size="12" font-weight="600">REGISTER OF THE SET</text>
  <text x="30" y="212" class="h sans" font-size="10">SHEET</text>
  <text x="82" y="212" class="h sans" font-size="10">NAME</text>
  <text x="330" y="212" class="h sans" font-size="10">WHAT IT PROVES</text>
  <line x1="18" y1="220" x2="882" y2="220" class="line" stroke-width="0.8"/>
  <text x="30" y="240" class="ink mono" font-size="11">1</text>
  <text x="82" y="240" class="ink sans" font-size="11">Cover and register of the set</text>
  <text x="330" y="240" class="sans" font-size="9.5" fill="#5a6a7a">what the set contains and at which revision</text>
  <line x1="18" y1="252" x2="882" y2="252" class="line" stroke-width="0.4"/>
  <text x="30" y="266" class="ink mono" font-size="11">2</text>
  <text x="82" y="266" class="ink sans" font-size="11">Test protocols</text>
  <text x="330" y="266" class="sans" font-size="9.5" fill="#5a6a7a">numbers with a measurement date and a validity rule</text>
  <line x1="18" y1="278" x2="882" y2="278" class="line" stroke-width="0.4"/>
  <text x="30" y="292" class="ink mono" font-size="11">3</text>
  <text x="82" y="292" class="ink sans" font-size="11">Work log</text>
  <text x="330" y="292" class="sans" font-size="9.5" fill="#5a6a7a">what was done and with which measured result</text>
  <line x1="18" y1="304" x2="882" y2="304" class="line" stroke-width="0.4"/>
  <text x="30" y="318" class="ink mono" font-size="11">4</text>
  <text x="82" y="318" class="ink sans" font-size="11">Concealed works</text>
  <text x="330" y="318" class="sans" font-size="9.5" fill="#5a6a7a">the decisions the structure rests on</text>
  <line x1="18" y1="330" x2="882" y2="330" class="line" stroke-width="0.4"/>
  <text x="30" y="344" class="ink mono" font-size="11">5</text>
  <text x="82" y="344" class="ink sans" font-size="11">Operating limits</text>
  <text x="330" y="344" class="sans" font-size="9.5" fill="#5a6a7a">where a number holds and where it stops</text>
  <line x1="18" y1="356" x2="882" y2="356" class="line" stroke-width="0.4"/>
  <text x="30" y="370" class="ink mono" font-size="11">6</text>
  <text x="82" y="370" class="ink sans" font-size="11">Defect registry</text>
  <text x="330" y="370" class="sans" font-size="9.5" fill="#5a6a7a">open defects and closed ones with a guard</text>
  <line x1="18" y1="382" x2="882" y2="382" class="line" stroke-width="0.4"/>
  <text x="30" y="396" class="ink mono" font-size="11">7</text>
  <text x="82" y="396" class="ink sans" font-size="11">Acceptance act</text>
  <text x="330" y="396" class="sans" font-size="9.5" fill="#5a6a7a">the verdict, the caveats, what was not checked</text>
  <line x1="18" y1="408" x2="882" y2="408" class="line" stroke-width="0.4"/>
  <line x1="18" y1="432" x2="882" y2="432" class="line" stroke-width="1.2"/>
  <text x="36" y="456" class="ink sans" font-size="11" font-weight="700">Validity rule (working)</text>
  <text x="36" y="472" class="t sans" font-size="10">Quality: until the first change to src/core/search or src/core/indexing</text>
  <text x="36" y="486" class="t sans" font-size="10">after the measurement, capped at 90 days. Structural facts: 30 days.</text>
  <text x="36" y="516" class="h sans" font-size="10">COMPOSED</text>
  <text x="124" y="516" class="ink mono" font-size="9.5">13.11.2026 · 7 sheets · revision 1</text>
  <text x="36" y="552" class="ink mono" font-size="9.5">COMPOSED BY  ________  M. ManSio  __.__.____</text>

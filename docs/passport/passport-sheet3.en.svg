  <rect x="10" y="10" width="880" height="620" class="line" stroke-width="2.5"/>
  <rect x="18" y="18" width="864" height="604" class="line" stroke-width="0.8"/>
  <text x="36" y="50" class="ink sans" font-size="20" font-weight="700">OBJECT QUALITY PASSPORT</text>
  <text x="36" y="68" class="h sans">QUALITY PASSPORT · mscodebase-intelligence · ManSio · EN</text>
  <text x="864" y="50" class="ink mono" font-size="12" text-anchor="end">SHEET 3 / 4</text>
  <text x="864" y="68" class="h sans" font-size="10" text-anchor="end">CONCEALED WORKS</text>
  <line x1="18" y1="82" x2="882" y2="82" class="line" stroke-width="1.5"/>
  <text x="30" y="102" class="h sans" font-size="10">#</text>
  <text x="78" y="102" class="h sans" font-size="10">ACT</text>
  <text x="172" y="102" class="h sans" font-size="10">DECISION (ADR)</text>
  <text x="470" y="102" class="h sans" font-size="10">STATUS</text>
  <text x="570" y="102" class="h sans" font-size="10">WHAT IT HOLDS</text>
  <text x="866" y="102" class="h sans" font-size="10" text-anchor="end">DATE</text>
  <line x1="18" y1="110" x2="882" y2="110" class="line" stroke-width="1"/>
  <text x="30" y="138" class="ink mono" font-size="10">ADR-0001</text>
  <text x="172" y="138" class="ink sans" font-size="11.5" font-weight="600">Threat model for the execute_script sandbox</text>
  <text x="470" y="138" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACCEPTED</text>
  <text x="570" y="138.0" class="sans" font-size="9.5" fill="#3d4b5a">what may be executed at all; bounds A1–A5</text>
  <text x="866" y="138" class="ink mono" font-size="10" text-anchor="end">05.08</text>
  <line x1="18" y1="166" x2="882" y2="166" class="line" stroke-width="0.6"/>
  <text x="30" y="180" class="ink mono" font-size="10">ADR-0002</text>
  <text x="172" y="180" class="ink sans" font-size="11.5" font-weight="600">RetractionReceipt: retracting SILENT memory</text>
  <text x="172" y="193" class="ink sans" font-size="11.5" font-weight="600">facts</text>
  <text x="470" y="180" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACCEPTED</text>
  <text x="570" y="180.0" class="sans" font-size="9.5" fill="#3d4b5a">memory is not «forever true»</text>
  <text x="866" y="180" class="ink mono" font-size="10" text-anchor="end">11.08</text>
  <line x1="18" y1="208" x2="882" y2="208" class="line" stroke-width="0.6"/>
  <text x="30" y="222" class="ink mono" font-size="10">ADR-0003</text>
  <text x="172" y="222" class="ink sans" font-size="11.5" font-weight="600">Verify-On-Read: check ACTIVE when reading</text>
  <text x="470" y="222" class="sans" font-size="9" font-weight="700" fill="#b26a00">PROPOSED</text>
  <text x="570" y="222.0" class="sans" font-size="9.5" fill="#3d4b5a">4 conditions; not implemented, awaits a run</text>
  <text x="866" y="222" class="ink mono" font-size="10" text-anchor="end">11.08</text>
  <line x1="18" y1="250" x2="882" y2="250" class="line" stroke-width="0.6"/>
  <text x="30" y="264" class="ink mono" font-size="10">ADR-0004</text>
  <text x="172" y="264" class="ink sans" font-size="11.5" font-weight="600">Typed dependency edges + retraction propagation</text>
  <text x="470" y="264" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACCEPTED</text>
  <text x="570" y="264.0" class="sans" font-size="9.5" fill="#3d4b5a">a retracted fact reaches dependent nodes</text>
  <text x="866" y="264" class="ink mono" font-size="10" text-anchor="end">12.08</text>
  <line x1="18" y1="292" x2="882" y2="292" class="line" stroke-width="0.6"/>
  <text x="30" y="306" class="ink mono" font-size="10">ADR-0005</text>
  <text x="172" y="306" class="ink sans" font-size="11.5" font-weight="600">pkg: anchors: closed-world package checks</text>
  <text x="470" y="306" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACCEPTED</text>
  <text x="570" y="306.0" class="sans" font-size="9.5" fill="#3d4b5a">version checks without trusting the network</text>
  <text x="866" y="306" class="ink mono" font-size="10" text-anchor="end">14.08</text>
  <line x1="18" y1="334" x2="882" y2="334" class="line" stroke-width="0.6"/>
  <text x="30" y="348" class="ink mono" font-size="10">ADR-0006</text>
  <text x="172" y="348" class="ink sans" font-size="11.5" font-weight="600">LSP graph enrichment: CALLS + semantic tokens</text>
  <text x="470" y="348" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACCEPTED</text>
  <text x="570" y="348.0" class="sans" font-size="9.5" fill="#3d4b5a">exact call-sites; ! 0 consumers for two outputs</text>
  <text x="866" y="348" class="ink mono" font-size="10" text-anchor="end">19.08</text>
  <line x1="18" y1="376" x2="882" y2="376" class="line" stroke-width="0.6"/>
  <text x="30" y="390" class="ink mono" font-size="10">ADR-0007</text>
  <text x="172" y="390" class="ink sans" font-size="11.5" font-weight="600">Git locks: one writer per resource across</text>
  <text x="172" y="403" class="ink sans" font-size="11.5" font-weight="600">agents</text>
  <text x="470" y="390" class="sans" font-size="9" font-weight="700" fill="#1f6f4a">ACTIVE</text>
  <text x="570" y="390.0" class="sans" font-size="9.5" fill="#3d4b5a">parallel sessions do not trample the tree</text>
  <text x="866" y="390" class="ink mono" font-size="10" text-anchor="end">24.08</text>
  <line x1="18" y1="418" x2="882" y2="418" class="line" stroke-width="0.6"/>
  <text x="36" y="456" class="ink sans" font-size="12" font-weight="600">How to read</text>
  <text x="36" y="472" class="t sans" font-size="10">Concealed works are decisions invisible in the output, but the</text>
  <text x="36" y="486" class="t sans" font-size="10">structure does not hold without them: trust, retraction, locks.</text>
  <text x="36" y="508" class="ink sans" font-size="12" font-weight="600">Act status</text>
  <text x="36" y="524" class="t sans" font-size="10">ACCEPTED — in force. PROPOSED — not implemented.</text>
  <text x="36" y="538" class="t sans" font-size="10">«! 0 consumers» — the act exists, the load does not.</text>
  <text x="36" y="566" class="ink mono" font-size="9.5">Source: docs/adr/ (7 acts), KNOWN_ISSUES.md (ADR-0006 debt).</text>

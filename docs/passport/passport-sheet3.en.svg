  <text x="478" y="386" class="sans" font-size="9" fill="#1b2a3a">up to 3 tests per symbol, weight 0.4</text>
  <text x="706" y="386" class="ink mono" font-size="9">CHANGELOG.md §3.5.0</text>
  <line x1="18" y1="410" x2="882" y2="410" class="line" stroke-width="0.6"/>
  <text x="36" y="456" class="ink sans" font-size="12" font-weight="600">How to read</text>
  <text x="36" y="472" class="t sans" font-size="10">An entry records work and its measured result, not a verdict.</text>
  <text x="36" y="486" class="t sans" font-size="10">No stamps on this sheet: a log neither accepts nor rejects.</text>
  <text x="36" y="508" class="ink sans" font-size="12" font-weight="600">Scope of the log</text>
  <text x="36" y="524" class="t sans" font-size="10">The 8 latest entries out of 164 in EXPERIMENTS_LOG.md.</text>
  <text x="36" y="538" class="t sans" font-size="10">The date is the experiment date, not the commit date.</text>
  <text x="36" y="566" class="ink mono" font-size="9.5">Source: EXPERIMENTS_LOG.md, CHANGELOG.md, KNOWN_ISSUES.md.</text>

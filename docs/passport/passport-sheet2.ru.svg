  <text x="36" y="486" class="t sans">СНИМОК — верно на дату замера, на текущий код не заявлено.</text>
  <text x="36" y="500" class="t sans">ПРОСРОЧЕНО — заявлено как текущее, срок вышел.</text>
  <text x="36" y="514" class="t sans">ОТКЛОНЕНО — решение проверено и осознанно закрыто.</text>
  <text x="36" y="536" class="ink sans" font-size="12" font-weight="600">Правило поверки (рабочее)</text>
  <text x="36" y="551" class="t sans">Качество: до первого изменения src/core/search или src/core/indexing</text>

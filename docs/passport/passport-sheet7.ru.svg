  <line x1="540" y1="486" x2="870" y2="486" class="line" stroke-width="0.8"/>
  <line x1="540" y1="508" x2="870" y2="508" class="line" stroke-width="0.8"/>
  <line x1="540" y1="530" x2="870" y2="530" class="line" stroke-width="0.8"/>
  <line x1="540" y1="552" x2="870" y2="552" class="line" stroke-width="0.8"/>
  <line x1="540" y1="574" x2="870" y2="574" class="line" stroke-width="0.8"/>
  <line x1="632" y1="442" x2="632" y2="596" class="line" stroke-width="0.8"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Паспорт качества объекта mscodebase-intelligence, лист 7">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#d9d4c3" stroke-width="0.6"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:"Liberation Sans","DejaVu Sans",Arial,Helvetica,sans-serif}
    .mono{font-family:"Liberation Mono","DejaVu Sans Mono","Courier New",monospace}
    .ink{fill:#1b2a3a}
    .line{stroke:#1b2a3a;fill:none}
    .h{font-size:10px;letter-spacing:1px;fill:#5a6a7a}
    .t{font-size:10.5px;fill:#5a6a7a}
    .ok{stroke:#1f6f4a;fill:none;stroke-width:2.5}
    .okt{fill:#1f6f4a;font-weight:700}
    .snap{stroke:#2b5b84;fill:none;stroke-width:2.5}
    .snapt{fill:#2b5b84;font-weight:700}
    .rej{stroke:#4a5568;fill:none;stroke-width:2.5}
    .rejt{fill:#4a5568;font-weight:700}
    .bad{stroke:#b3261e;fill:none;stroke-width:2.5}
    .badt{fill:#b3261e;font-weight:700}
  </style>

  <rect width="900" height="640" fill="#f6f3ea"/>
  <rect width="900" height="640" fill="url(#grid)"/>
  <rect x="10" y="10" width="880" height="620" class="line" stroke-width="2.5"/>
  <rect x="18" y="18" width="864" height="604" class="line" stroke-width="0.8"/>
  <text x="36" y="50" class="ink sans" font-size="20" font-weight="700">ПАСПОРТ КАЧЕСТВА ОБЪЕКТА</text>
  <text x="36" y="68" class="h sans">QUALITY PASSPORT · mscodebase-intelligence · ManSio</text>
  <text x="864" y="50" class="ink mono" font-size="12" text-anchor="end">ЛИСТ 7 / 7</text>
  <text x="864" y="68" class="h sans" font-size="10" text-anchor="end">АКТ ПРИЁМКИ</text>
  <line x1="18" y1="82" x2="882" y2="82" class="line" stroke-width="1.5"/>
  <text x="36" y="118" class="ink sans" font-size="11" font-weight="700">ПРЕДЪЯВЛЕНО К ПРИЁМКЕ</text>
  <text x="36" y="134" class="sans" font-size="9.5" fill="#1b2a3a">mscodebase-intelligence v3.5.0, ревизия main @ 1c4062d от 13.11.2026. Комплект — 7</text>
  <text x="36" y="146" class="sans" font-size="9.5" fill="#1b2a3a">листов, ревизия паспорта совпадает с ревизией объекта.</text>
  <text x="36" y="178" class="ink sans" font-size="11" font-weight="700">ПРИНЯТО</text>
  <text x="36" y="194" class="sans" font-size="9.5" fill="#1b2a3a">Видимых инструментов 17 из 69 — совпадает с FACTS §2.</text>
  <text x="36" y="208" class="sans" font-size="9.5" fill="#1b2a3a">Загружено 31 грамматика — совпадает с FACTS §4.</text>
  <text x="36" y="222" class="sans" font-size="9.5" fill="#1b2a3a">Реранкеры: 4 проверено, 0 внедрено — E38/E39, решение закрыто.</text>
  <text x="36" y="250" class="ink sans" font-size="11" font-weight="700">ПРИНЯТО С ОГОВОРКОЙ</text>
  <text x="36" y="266" class="sans" font-size="9.5" fill="#1b2a3a">hit@5 0.900 и 0.729 — снимок 25.10; после него 15 коммитов в путях поиска.</text>
  <text x="36" y="280" class="sans" font-size="9.5" fill="#1b2a3a">docs-канал: hit@1 0.000 — открытый дефект, лист 6, Б-01.</text>
  <text x="512" y="118" class="ink sans" font-size="11" font-weight="700">НЕ ПРОВЕРЯЛОСЬ</text>
  <text x="512" y="134" class="sans" font-size="9.5" fill="#1b2a3a">Подпись сборки: релиза нет, attestation не выпускалась.</text>
  <text x="512" y="148" class="sans" font-size="9.5" fill="#1b2a3a">Внешняя точность: 2 репозитория, 65 коммитов; на других</text>
  <text x="512" y="160" class="sans" font-size="9.5" fill="#1b2a3a">корпусах не мерили.</text>
  <text x="512" y="174" class="sans" font-size="9.5" fill="#1b2a3a">Задержка под параллельной нагрузкой: p50 панели, не</text>
  <text x="512" y="186" class="sans" font-size="9.5" fill="#1b2a3a">стресс-тест.</text>
  <text x="512" y="214" class="ink sans" font-size="11" font-weight="700">ВЕРДИКТ МЕНЯЕТСЯ, ЕСЛИ</text>
  <text x="512" y="230" class="sans" font-size="9.5" fill="#1b2a3a">Пересчёт на текущем коде вернёт значения FACTS §5 — оговорка</text>
  <text x="512" y="242" class="sans" font-size="9.5" fill="#1b2a3a">снимается.</text>
  <text x="512" y="256" class="sans" font-size="9.5" fill="#1b2a3a">Выйдет релиз с attestation — строка «СБОРКА» станет</text>
  <text x="512" y="268" class="sans" font-size="9.5" fill="#1b2a3a">подписанной.</text>
  <line x1="18" y1="304" x2="882" y2="304" class="line" stroke-width="0.8"/>
  <text x="36" y="330" class="ink sans" font-size="11.5" font-weight="700">РЕШЕНИЕ: объект принят с 2 оговорками; 3 пункта не проверялись.</text>
  <text x="36" y="356" class="ink mono" font-size="9.5">СДАЛ  ________  М. ManSio  __.__.2026</text>
  <text x="512" y="356" class="ink mono" font-size="9.5">ПРИНЯЛ  ________  заказчик  __.__.2026</text>
  <text x="36" y="456" class="ink sans" font-size="12" font-weight="600">Как читать</text>
  <text x="36" y="472" class="t sans" font-size="10">Акт закрывает комплект: он говорит не «всё хорошо»,</text>
  <text x="36" y="486" class="t sans" font-size="10">а «что именно принято, с чем и чего мы не проверяли».</text>
  <text x="36" y="508" class="ink sans" font-size="12" font-weight="600">Основание</text>
  <text x="36" y="524" class="t sans" font-size="10">Оговорки не снимаются подписью: их снимает пересчёт.</text>
  <text x="36" y="538" class="t sans" font-size="10">Каждая строка акта ссылается на лист или раздел FACTS.</text>
  <text x="36" y="566" class="ink mono" font-size="9.5">Источник: листы 2–6 этого комплекта.</text>

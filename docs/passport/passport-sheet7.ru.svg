  <text x="640" y="545" class="ink mono" font-size="10">a93abe59…05794985</text>
  <text x="548" y="567" class="h sans" font-size="10">СБОРКА</text>
  <text x="640" y="567" class="ink mono" font-size="10">не подписана · до релиза</text>
